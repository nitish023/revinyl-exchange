# Local Postgres for development and tests. Production uses Neon (see render.yaml).
# Port 5433 so it doesn't clash with a Postgres you may already run on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revinyl
      POSTGRES_PASSWORD: revinyl
      POSTGRES_DB: revinyl
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U revinyl']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
